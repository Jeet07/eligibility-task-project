version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: task_postgres
    environment:
      POSTGRES_USER: taskdb
      POSTGRES_PASSWORD: bdksat7
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - task_network
    restart: unless-stopped

  backend:
    build: .
    container_name: task_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://taskdb:bdksat7@postgres:5432/taskdb
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    networks:
      - task_network
    command: sh -c "sleep 10 && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: task_celery
    depends_on:
      - postgres
      - redis
      - backend
    environment:
      DATABASE_URL: postgresql://taskdb:bdksat7@postgres:5432/taskdb
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    networks:
      - task_network
    command: sh -c "sleep 15 && celery -A assignment_engine worker --loglevel=info"
    restart: unless-stopped

  flower:
    build: .
    container_name: task_flower
    depends_on:
      - redis
      - celery_worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    networks:
      - task_network
    command: sh -c "sleep 20 && celery -A assignment_engine flower --port=5555"
    restart: unless-stopped

  redis_ui:
    image: rediscommander/redis-commander:latest
    container_name: task_redis_ui
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - task_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  task_network:
    driver: bridge
    name: task_network
